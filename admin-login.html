<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | One Optics Clinic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script>
        if (localStorage.getItem('oneOpticsTheme') === 'dark') {
            document.documentElement.classList.add('dark-mode');
            document.addEventListener('DOMContentLoaded', () => document.body.classList.add('dark-mode'));
        }
    </script>
    <style>
        body {
            background-color: var(--bg-light);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-box {
            background: var(--bg-color);
            padding: 3rem;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border-top: 4px solid var(--primary-color);
            border-bottom: 4px solid var(--accent-color);
        }
        .login-box h2 {
            margin-bottom: 0.5rem;
            color: var(--text-dark);
        }
        .login-box p {
            color: var(--text-light);
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }
        .error-msg {
            color: #dc3545;
            background: rgba(220, 53, 69, 0.1);
            padding: 0.8rem;
            border-radius: 4px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            display: none;
            border: 1px solid #dc3545;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <a href="index.html" style="font-size: 1.2rem; font-weight: 700; color: var(--primary-color); display: block; margin-bottom: 0.5rem;">ONE OPTICS Clinic</a>
        <p style="font-style: italic; color: var(--accent-color); margin-bottom: 2rem;">Clear Vision • Brighter Tomorrow</p>
        
        <h2>Admin Portal</h2>
        <p>Sign in to manage inventory and appointments.</p>

        <div id="errorMsg" class="error-msg">Invalid credentials. For demo, use admin / admin123</div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group" style="text-align: left;">
                <label for="username">Username</label>
                <input type="text" id="username" class="form-control" required>
            </div>
            <div class="form-group" style="text-align: left;">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign In</button>
        </form>
        
        <p style="margin-top: 2rem; font-size: 0.8rem;">
            <a href="index.html">&larr; Back to Website</a>
        </p>
    </div>

    <script src="js/database.js"></script>
    <script src="js/theme.js"></script>
    <script>
        // Check if already logged in
        if (localStorage.getItem('adminAuth') === 'true') {
            window.location.href = 'admin-dashboard.html';
        }

        async function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            try {
                const result = await window.OpticsDB.login(user, pass);
                if (result.token) {
                    window.location.href = 'admin-dashboard.html';
                }
            } catch (err) {
                document.getElementById('errorMsg').textContent = "Invalid credentials. Ensure backend is running.";
                document.getElementById('errorMsg').style.display = 'block';
            }
        }
    </script>
</body>
</html>
